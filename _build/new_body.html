<body>
<header>
  <div class="hd-row">
    <h1>识食<span class="sub-brand">AI 饮食管家</span></h1>
    <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" aria-label="切换主题"></button>
  </div>
  <p id="hdDate"></p>
</header>
<main>
<!-- ============ 今日 ============ -->
<div class="tab" id="tab-today">
  <div id="todayBox"></div>
</div>

<!-- ============ 库存 ============ -->
<div class="tab" id="tab-stock">
  <div id="stockAlert"></div>
  <!-- 概览 / 提醒 / 缺口（由 renderStock 填充） -->
  <div id="stockBox"></div>
  <div id="stockActions"></div>

  <!-- 手动添加：低频操作，默认折叠，避免每天进来先滚过一张大表单 -->
  <details class="card" id="addBox">
    <summary><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>手动添加食物<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></summary>
    <div class="fld searchbox" style="margin-top:14px">
      <label>从内置食物库搜索（每 100g 营养）</label>
      <input id="q" placeholder="鸡胸肉 / 彩椒 / 鸡蛋 / 荞麦面" autocomplete="off">
      <div class="sug" id="sug"></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>总克重 (g)</label><input id="addG" type="number" inputmode="decimal" placeholder="500"></div>
      <div class="fld"><label>&nbsp;</label><button class="btn-g" onclick="addFromDb()">加入库存</button></div>
    </div>
    <div class="hint"><svg class="ic-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg><span>包装食品去「拍照」页识别营养成分表更准</span></div>
  </details>
</div>

<!-- ============ 拍照 ============ -->
<div class="tab" id="tab-scan">
  <details class="card" id="apiBox">
    <summary>识别接口设置<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></summary>
    <div class="fld"><label>快速选择服务商</label>
      <select id="apiPreset" onchange="applyPreset()">
        <option value="">自定义</option>
        <option value="zhipu">智谱 GLM-4V-Flash（免费）</option>
        <option value="qwen">通义千问 Qwen-VL</option>
        <option value="openai">OpenAI GPT-4o-mini</option>
      </select>
    </div>
    <div class="hint" style="margin:-4px 0 12px"><span>没有 Key？去 bigmodel.cn 注册创建 API Key，选「智谱」即可，目前有免费模型。</span></div>
    <div class="fld"><label>API 地址（OpenAI 兼容 /chat/completions）</label><input id="apiBase" placeholder="https://api.openai.com/v1"></div>
    <div class="grid2">
      <div class="fld"><label>模型</label><input id="apiModel" placeholder="gpt-4o-mini"></div>
      <div class="fld"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..."></div>
    </div>
    <button class="btn-o" onclick="saveApi()">保存设置</button>
    <div class="hint" style="margin-top:8px"><span>支持 OpenAI 及任意兼容接口（智谱、通义千问等），必须选支持看图的模型。Key 只存本机，不会上传。</span></div>
  </details>

  <div class="card">
    <h3><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>拍照识别</h3>
    <div class="fld"><label>识别模式</label>
      <select id="scanMode">
        <option value="pack">包装食品：拍配料表 + 营养成分表</option>
        <option value="fresh">生鲜食材：拍彩椒 / 鸡蛋 / 蔬菜等</option>
      </select>
    </div>
    <input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
    <button class="btn-g" onclick="document.getElementById('photo').click()">拍照或选择图片</button>
    <div id="prevBox"></div>
    <button class="btn-o" style="margin-top:8px" onclick="openManual()">不拍照，手动输入营养数据</button>
    <div id="scanResult" style="display:none;margin-top:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:12.5px;color:var(--ink-2)">
        <span class="chip neutral">识别结果 · 请核对</span>
      </div>
      <div class="fld"><label>食物名称</label><input id="rN"></div>
      <div class="fld"><label>归类（决定库存里的分组）</label>
        <select id="rCat">
          <option value="protein">肉蛋奶 / 蛋白质类</option>
          <option value="staple">主食</option>
          <option value="veg">蔬菜</option>
          <option value="fruit">水果</option>
          <option value="fat">油脂坚果</option>
          <option value="other" selected>其他</option>
        </select>
      </div>
      <div class="grid2">
        <div class="fld"><label>热量 kcal/100g</label><input id="rK" type="number" inputmode="decimal"></div>
        <div class="fld"><label>蛋白质 g/100g</label><input id="rP" type="number" inputmode="decimal"></div>
        <div class="fld"><label>脂肪 g/100g</label><input id="rF" type="number" inputmode="decimal"></div>
        <div class="fld"><label>碳水 g/100g</label><input id="rC" type="number" inputmode="decimal"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>总克重 (g)</label><input id="rG" type="number" inputmode="decimal" placeholder="500"></div>
        <div class="fld"><label>&nbsp;</label><button class="btn-o" onclick="aiToStock()">加入库存</button></div>
      </div>
      <button class="btn-g" onclick="aiToLog()">直接记入今日饮食</button>
    </div>
  </div>
</div>

<!-- ============ 我的 ============ -->
<div class="tab" id="tab-me">
  <div class="card">
    <h3><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>我的身体数据</h3>
    <div class="grid2">
      <div class="fld"><label>性别</label><select id="pSex"><option value="m">男</option><option value="f">女</option></select></div>
      <div class="fld"><label>年龄</label><input id="pAge" type="number" inputmode="numeric"></div>
      <div class="fld"><label>身高 (cm)</label><input id="pH" type="number" inputmode="decimal"></div>
      <div class="fld"><label>体重 (kg)</label><input id="pW" type="number" inputmode="decimal"></div>
    </div>
    <div class="fld"><label>日常活动水平（不含训练）</label>
      <select id="pAct">
        <option value="1.2">久坐 — 办公室，几乎不运动</option>
        <option value="1.375">轻度 — 每天走路 / 偶尔活动</option>
        <option value="1.55" selected>中度 — 每周运动 3–5 次</option>
        <option value="1.725">高度 — 每周运动 6–7 次</option>
        <option value="1.9">运动员级 — 体力劳动 + 每天训练</option>
      </select>
    </div>
    <div class="grid2">
      <div class="fld"><label>目标调整 (kcal/天)</label>
        <select id="pAdj">
          <option value="-500">减脂 −500</option>
          <option value="-300">温和减脂 −300</option>
          <option value="0" selected>维持体重 0</option>
          <option value="300">增肌 +300</option>
          <option value="500">快速增肌 +500</option>
        </select>
      </div>
      <div class="fld"><label>蛋白质目标 (g/kg)</label>
        <select id="pPk"><option value="1.2">1.2 普通人</option><option value="1.6">1.6 健身</option><option value="2.0" selected>2.0 增肌期</option><option value="2.4">2.4 高强度</option></select>
      </div>
    </div>
    <button class="btn-g" onclick="saveProfile()">保存并计算</button>
    <div id="pResult" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h3><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 7v10M17 7v10M20 9v6"/><path d="M7 12h10"/></svg>记录今日训练</h3>
    <div class="grid2">
      <div class="fld"><label>运动</label><select id="eN"></select></div>
      <div class="fld"><label>时长 (分钟)</label><input id="eMin" type="number" inputmode="numeric" placeholder="60"></div>
    </div>
    <button class="btn-g" onclick="addEx()">添加训练消耗</button>
    <div id="exList" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h3><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h11l3 3v11H5z"/><path d="M8 5v5h7V5"/><path d="M8 19v-5h8v5"/></svg>数据</h3>
    <div class="btnrow">
      <button class="btn-s" onclick="exportData()">导出备份</button>
      <button class="btn-s" onclick="document.getElementById('imp').click()">导入备份</button>
      <button class="btn-r" onclick="resetAll()">清空</button>
    </div>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
    <div class="hint" style="margin-top:12px"><span>手机浏览器打开 → 菜单「添加到主屏幕」，可像 App 一样离线使用。数据只存本机，换手机请先导出再导入。</span></div>
  </div>
</div>

<div class="disclaimer">营养数据为估算，仅供参考，不构成医疗建议</div>
</main>

<nav>
  <button data-t="tab-today" class="on" onclick="go('tab-today')"><span class="ic-nav"></span>今日</button>
  <button data-t="tab-stock" onclick="go('tab-stock')"><span class="ic-nav"></span>库存</button>
  <button data-t="tab-scan" onclick="go('tab-scan')"><span class="ic-nav"></span>拍照</button>
  <button data-t="tab-me" onclick="go('tab-me')"><span class="ic-nav"></span>我的</button>
</nav>
<div class="overlay" id="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
